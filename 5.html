<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- icons -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>&#10008-FOUR (shirt)</title>
    <style>
        :root{
            --black:rgb(0, 0, 0);
            --biig:rgb(200, 169, 107);
            --white:rgb(255, 255, 255);
        }
        nav{
            height: 60px;
            padding: 0 5% !important;
            background-color: rgba(0, 0, 0, 0.3);
        }
        nav #link{
            color: var(--white);
            font-size: 22px;
            transition: all 2s;
        }
        nav #link:hover{
            color: var(--biig);
            scale: 1.2;
        }
        nav #logo{
            color: var(--white);
            font-size: 35px;
            font-weight: bold;
            font-family: "Architects Daughter", cursive;
            transition: all 2s;
        }
        nav #logo:hover{
           color: var(--biig);
           scale: 1.5;
           cursor: pointer;
        }
        @media screen and (max-width:450px){
        nav #logo{
            color: var(--white);
            font-size: 25px;
            margin-left: 8px;
            font-family: "Libre Baskerville", serif;
        }
        #ee{
            background-color: var(--white);
            width: 175px;
            padding: 10px;
        }
        nav #link{
           font-size: 20px;
           color: var(--black);
           padding-left:10px;
           transition: all 3s;
        }
        nav #link :hover{
            scale: 1.2;
        } 
        } 
        @media screen and (min-width:500px) and (max-width:900px){
            nav #logo{
                font-family: "Libre Baskerville", serif;
            }
            #ee{
                background-color: var(--white);
                width: 260px;
                padding-left: 20px;
            }
            nav #link{
                font-size: 35px;
                color: var(--white);
                padding-left:20px;
            } 
        }
        @media screen and (min-width:1281px) and (max-width:3000px){
            nav{
                height: 75px;
            }
            nav #logo{
               font-family: "Libre Baskerville", serif;
               font-size: 60px;
                margin-left: 8px;
            }    
            nav #link{
                font-size: 35px;
                color: var(--white);
                padding-left:20px;
            }
        }      
        .text h2{
            font-size: 35px;
            font-weight: bold;
            text-align: center;
            color: rgb(200, 169, 107);
            padding-top: 70px;
        }
        .text .dis{
            display: flex;
            justify-content: space-evenly;
            align-items: center; 
        }
        .text .dis .diss dt{
            font-size: 35px;
            font-weight: bold;
            color: rgb(200, 169, 107);
        }
        .text .dis .diss dd{
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .img{
            width: 400px;
            height: 420px;
            background-image: url(./img/pexels-eben-31961165.jpg);
            background-position: center;
            background-size: cover;
            border-radius: 25px;
        }
        @media screen and (max-width:450px){
           .text .dis{ 
            flex-direction: column-reverse;
        } 
        .text .dis .diss dt{
            text-align: center;
        }
        .text .dis .diss dd{
            font-size: 23px;
            text-align: center;
        }
        .img{
            width: 350px;
            height: 420px;
        }
        }
        @media screen and (min-width:1281px) and (max-width:3000px){
           .text h2{
            font-size: 55px;
            padding-top:90px;
            padding-bottom: 30px;
        }
        .text .dis{
            display: flex;
            justify-content: space-evenly;
            align-items: center; 
            width: 100%;
            height: 70vh;
        }
        .text .dis .diss dt{
            font-size: 40px;
        }
        .text .dis .diss dd{
            font-size: 30px;
        }
        .img{
            width: 450px;
            height: 550px;
        } 
        }
    </style>
</head>
<body>
    <!-- nav -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" >
        <p class="navbar-brand" id="logo">&#10008-FOUR</p>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto" id="ee">
                <li class="nav-item active">
                <a class="nav-link" id="link" href="index.html"><i class="fa-solid fa-house"></i> <span class="sr-only">(current)</span></a>
                </li>
            </ul>
        </div>
    </nav>





    <div class="text">
        <h2>Details</h2>
        <div class="dis">
            <dl class="diss">
                <dt>Color</dt>
                <dd>All colors are available.</dd>
                <dt>Size</dt>
                <dd>Only sizes X, 2X, and 3X are available.</dd>
                <dt>ElMaterial</dt>
                <dd>100% Cotton</dd>
                <dt>Price</dt>
                <dd>999.99EGP</dd>
            </dl>
        <div class="img"></div>
       </div>  
    </div>



    
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script> -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
