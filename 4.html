<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#10008-FOUR (t-shirt)</title>
    <style>
        .text h2{
            font-size: 35px;
            font-weight: bold;
            text-align: center;
            color: rgb(200, 169, 107);
        }
        .text .dis{
            display: flex;
            justify-content: space-evenly;
            align-items: center; 
        }
        .text .dis .diss dt{
            font-size: 30px;
            font-weight: bold;
            color: rgb(200, 169, 107);
        }
        .text .dis .diss dd{
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .img{
            width: 400px;
            height: 420px;
            background-image: url(./img/pexels-mart-production-9558761.jpg);
            background-position: center;
            background-size: cover;
            border-radius: 25px;
        }
        @media screen and (max-width:450px){
           .text .dis{ 
            flex-direction: column-reverse;
        } 
        .text .dis .diss dt{
            text-align: center;
        }
        .text .dis .diss dd{
            font-size: 23px;
            text-align: center;
        }
        .img{
            width: 350px;
            height: 420px;
        }
        }
    </style>
</head>
<body>
    <div class="text">
        <h2>Details</h2>
        <div class="dis">
            <dl class="diss">
                <dt>Color</dt>
                <dd>All colors are available.</dd>
                <dt>Size</dt>
                <dd>Only sizes X, 2X, and 3X are available.</dd>
                <dt>ElMaterial</dt>
                <dd>100% Cotton</dd>
                <dt>Price</dt>
                <dd>1399.99EGP</dd>
            </dl>
        <div class="img"></div>
       </div>  
    </div>
</body>
</html>
